<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Light Ori - Phaser MVP</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <h1>🦆 Light Ori (Engine Prototype)</h1>
      <p>Phaser 기반 육성 시뮬레이션 프로토타입 · 원본 캐릭터 시트 렌더링</p>
    </header>

    <main class="layout">
      <section class="panel" id="engine-panel">
        <h2>게임 화면</h2>
        <div id="game-root"></div>
        <p class="hint">
          원본 이미지 파일을 <code>assets/duck-cast.png</code>에 넣으면, 캐릭터를 편집 없이 원본 시트에서 그대로 잘라 표시합니다.
        </p>
      </section>

      <section class="panel" id="control-panel">
        <h2>플레이 제어</h2>
        <div id="duck-info"></div>
        <div class="action-grid">
          <button id="feed-jelly">젤리 먹이기</button>
          <button id="play-home">집에서 아이템 놀이</button>
          <button id="use-night-item">밤 아이템 사용</button>
          <button id="advance-day">하루 진행</button>
        </div>
        <label for="map-select">맵</label>
        <select id="map-select"></select>
        <button id="visit-map">외출하기</button>
        <button id="next-gen">결혼/다음 세대</button>
        <div id="map-info"></div>
      </section>

      <section class="panel" id="relationship-panel">
        <h2>관계도</h2>
        <div id="relationship-list"></div>
      </section>

      <section class="panel" id="log-panel">
        <h2>이벤트 로그</h2>
        <ol id="event-log"></ol>
      </section>
    </main>
  </body>
</html>
