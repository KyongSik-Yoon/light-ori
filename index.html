<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Light Ori - 오리 육성 시뮬레이션</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>🦆 Light Ori</h1>
      <p>브라우저에서 즐기는 오리 육성 시뮬레이션 MVP</p>
    </header>

    <main class="layout">
      <section class="panel" id="duck-panel">
        <h2>내 오리</h2>
        <div class="duck-card">
          <div class="duck-avatar" id="duck-avatar">🥚</div>
          <div class="duck-info" id="duck-info"></div>
        </div>
        <div class="action-grid">
          <button id="feed-jelly">젤리 먹이기</button>
          <button id="play-home">집에서 아이템 놀이</button>
          <button id="use-night-item">밤 아이템 사용</button>
          <button id="advance-day">하루 진행</button>
        </div>
      </section>

      <section class="panel" id="map-panel">
        <h2>외출</h2>
        <label for="map-select">맵 선택</label>
        <select id="map-select"></select>
        <div class="action-grid single">
          <button id="visit-map">외출하기</button>
        </div>
        <div id="map-info"></div>
      </section>

      <section class="panel" id="shop-panel">
        <h2>상점</h2>
        <div id="shop-items"></div>
      </section>

      <section class="panel" id="relationship-panel">
        <h2>관계도</h2>
        <div id="relationship-list"></div>
      </section>


      <section class="panel" id="reference-panel">
        <h2>캐릭터 비주얼 레퍼런스</h2>
        <p>첨부해주신 캐릭터 이미지를 기준으로 게임 내 등장 캐릭터를 한눈에 볼 수 있도록 반영했습니다.</p>
        <img class="reference-image" src="assets/duck-character-board.svg" alt="Light Ori 캐릭터 레퍼런스 보드" />
      </section>

      <section class="panel" id="log-panel">
        <h2>이벤트 로그</h2>
        <ol id="event-log"></ol>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
